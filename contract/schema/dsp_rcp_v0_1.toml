# Contrato DSP↔RCP, v0.1.
#
# El plan del DSP (§6) dice que este contrato lo posee este proyecto, al
# contrario que `DRx↔DSP`, que lo posee el proyecto DRx y aquí sólo se consume
# (ver `contract/vendor/`). Este fichero es la única fuente de verdad del
# formato de cable y de él se generan las tres implementaciones: Rust para el
# DSP, Python para el RCP y el banco de pruebas, TypeScript para el MMI. No se
# escribe ninguna a mano.
#
# Reglas del formato, y en qué se apartan del contrato hermano DRx↔DSP:
#
#   * Little-endian, empaquetado, sin relleno implícito. Todo relleno es un
#     campo con nombre que vale 0. Igual que en DRx↔DSP.
#   * **Se admite coma flotante**, y aquí está la única divergencia deliberada
#     respecto al contrato hermano. El DRx prohíbe flotantes porque tiene que
#     coincidir bit a bit entre el compilador C de un Cortex-R5 y Rust, y los
#     formatos flotantes no lo garantizan entre arquitecturas. En este enlace
#     los dos extremos son CPU de propósito general con IEEE-754 (Linux SBC del
#     lado DSP, servidor del lado RCP), así que esa razón no aplica. A cambio se
#     gana lo que el plan pide explícitamente: el flujo de momentos viaja «a
#     precisión plena», y el RCP lo mapea sin copia con `numpy.frombuffer`. La
#     diezmación a 8/16 bits es cosa del codificador Level-II del RCP, no del
#     cable.
#   * Los ángulos viajan en **grados**, no en cuenta cruda de encoder. Al revés
#     que en DRx↔DSP: allí el DRx no puede convertir porque las constantes de
#     calibración son del consumidor; aquí el DSP ya las aplicó, y devolver
#     cuentas crudas obligaría al RCP a duplicar esa calibración.
#   * Los mensajes de longitud variable son **cabecera fija + carga útil**. La
#     cabecera dice cuántos elementos vienen detrás; la carga es un array denso.
#     Ningún mensaje lleva longitud implícita.
#   * **Dos relojes, nunca un campo llamado `timestamp` a secas.** El RCP tiene
#     esta regla entre las suyas innegociables y tiene razón: la hora de pared
#     es lo que NEXRAD exige en el archivo Level-II y lo que ORPG espera, pero
#     salta cuando alguien disciplina el reloj, así que ordenar radiales o medir
#     intervalos con ella es incorrecto. Un radial lleva por eso los dos:
#     `acq_time_utc_ns` (hora de pared, para archivar) y `acq_monotonic_ns`
#     (monótono del DSP, para ordenar y medir). Los demás mensajes llevan sólo
#     hora de pared y lo dicen en el nombre del campo, porque los lee un
#     operador. El reloj monótono NO es comparable entre procesos: al RCP le
#     sirve para diferencias dentro del mismo flujo, no para casar con los
#     suyos.
#
# Cualquier cambio de formato sube `version_minor` (compatible) o
# `version_major` (rompe), y actualiza los tests.

[meta]
name = "dsp_rcp"
version_major = 1
version_minor = 2
magic = 0x4C4D4453  # "LMDS" en ASCII, little-endian
endianness = "little"

# ---------------------------------------------------------------------------
# Cabecera común a todos los mensajes. Misma forma y mismo tamaño que la de
# DRx↔DSP a propósito: un solo lector de tramas sirve para los dos enlaces.
# ---------------------------------------------------------------------------
[[header.fields]]
name = "magic"
type = "u32"
doc = "0x4C4D4453. Si no coincide, el flujo no es de este contrato."

[[header.fields]]
name = "version_major"
type = "u8"
doc = "Incompatible al cambiar."

[[header.fields]]
name = "version_minor"
type = "u8"
doc = "Compatible hacia atrás dentro del mismo major."

[[header.fields]]
name = "msg_type"
type = "u8"
doc = "Ver la tabla de tipos de mensaje."

[[header.fields]]
name = "flags"
type = "u8"
doc = "Reservado en v0.1; tiene que valer 0."

[[header.fields]]
name = "payload_len"
type = "u32"
doc = """Bytes que siguen a ESTA cabecera de 12 B, contando la cabecera del mensaje
más su carga útil variable si la tiene. Un lector de tramas hace por tanto: leer
12 B, leer payload_len B, y ya tiene el mensaje entero sin conocer su tipo. Para
un moment_ray de 4 celdas y 2 momentos vale 88 + 2·(16 + 4·4) = 152, no 64."""

# ---------------------------------------------------------------------------
# Mensajes. `dir` es el sentido: "up" del DSP al RCP, "down" del RCP al DSP.
# ---------------------------------------------------------------------------

[[message]]
name = "moment_ray"
type_id = 1
dir = "up"
doc = """Un radial de momentos: la observación autoritativa que el RCP archiva
como Level-II y sirve a ORPG.

Detrás de esta cabecera van `n_moments` bloques, cada uno formado por un
descriptor `moment_field` de 16 B seguido de `n_gates` valores. El tipo de los
valores lo dice `moment_field.data_type`; en v0.1 siempre es f32."""

fields = [
  { name = "seq", type = "u32", doc = "Contador de radiales, envuelve. Detecta pérdidas." },
  { name = "acq_time_utc_ns", type = "u64", doc = "Instante del primer pulso del radial en hora de pared, ns desde el epoch UTC. Es el que se archiva en Level-II y se sirve a ORPG." },
  { name = "acq_monotonic_ns", type = "u64", doc = "El mismo instante en el reloj monótono del DSP, ns. Sirve para ordenar y medir intervalos sin que un salto de UTC los corrompa; NO comparable entre procesos." },
  { name = "volume_seq", type = "u32", doc = "Volumen al que pertenece. Enmarca el archivo Level-II." },
  { name = "sweep_seq", type = "u16", doc = "Barrido dentro del volumen." },
  { name = "ray_index", type = "u16", doc = "Radial dentro del barrido." },
  { name = "n_gates", type = "u16", doc = "Celdas de rango por momento." },
  { name = "n_pulses", type = "u16", doc = "Pulsos integrados en este radial." },
  { name = "bins_valid", type = "u16", doc = "Celdas con adquisición correcta. Distinto de que el enlace esté vivo." },
  { name = "n_moments", type = "u8", doc = "Bloques de momento en la carga útil." },
  { name = "sweep_mode", type = "u8", doc = "Ver la enumeración de modos de barrido." },
  { name = "prf_mode", type = "u8", doc = "Ver la enumeración de modos de dealiasing." },
  { name = "ray_flags", type = "u8", doc = "Ver la tabla de banderas de radial." },
  { name = "pad0", type = "u16", doc = "Relleno explícito; vale 0." },
  { name = "az_start_deg", type = "f32", doc = "Azimut al abrir el radial, grados." },
  { name = "az_end_deg", type = "f32", doc = "Azimut al cerrarlo. Con az_start da el ancho barrido." },
  { name = "el_start_deg", type = "f32", doc = "Elevación al abrir el radial, grados." },
  { name = "el_end_deg", type = "f32", doc = "Elevación al cerrarlo, grados." },
  { name = "fixed_angle_deg", type = "f32", doc = "Ángulo nominal del barrido: elevación en PPI, azimut en RHI." },
  { name = "start_range_m", type = "f32", doc = "Rango al centro de la primera celda, metros." },
  { name = "gate_spacing_m", type = "f32", doc = "Separación entre centros de celda, metros." },
  { name = "prf_hz", type = "f32", doc = "PRF efectiva del radial. En dual-PRF, la media." },
  { name = "nyquist_velocity", type = "f32", doc = "Velocidad no ambigua tras dealiasing, m/s." },
  { name = "unambiguous_range_m", type = "f32", doc = "Rango no ambiguo, metros. Es c/(2·PRF) salvo recuperación de trip." },
  { name = "noise_floor_dbm", type = "f32", doc = "Suelo de ruido vigente al procesar, dBm." },
  { name = "radar_constant_db", type = "f32", doc = "Constante de radar aplicada, dB. El RCP la necesita para rehacer dBZ." },
]

[[message]]
name = "moment_field"
type_id = 0
dir = "payload"
doc = """Descriptor de un momento dentro de la carga útil de un moment_ray.

No viaja suelto: siempre va incrustado, y por eso su type_id es 0. Detrás de
cada descriptor van `n_gates` valores del tipo que indica `data_type`."""

fields = [
  { name = "kind", type = "u8", doc = "Qué momento es. Ver la enumeración de momentos." },
  { name = "data_type", type = "u8", doc = "Codificación de los valores. En v0.1 siempre f32." },
  { name = "flags", type = "u8", doc = "Ver la tabla de banderas de momento." },
  { name = "pad0", type = "u8", doc = "Relleno explícito; vale 0." },
  { name = "n_gates", type = "u32", doc = "Valores que siguen. Tiene que coincidir con el n_gates del radial." },
  { name = "scale", type = "f32", doc = "Factor de escala. Vale 1.0 con data_type f32." },
  { name = "offset", type = "f32", doc = "Desplazamiento. Vale 0.0 con data_type f32." },
]

[[message]]
name = "spectrum_frame"
type_id = 2
dir = "up"
doc = """Traza del analizador de espectro de FI. Detrás van `n_bins` valores f32
en dB, de menor a mayor frecuencia."""

fields = [
  { name = "seq", type = "u32", doc = "Contador de tramas, envuelve." },
  { name = "capture_time_utc_ns", type = "u64", doc = "Instante de la captura en hora de pared, ns desde el epoch UTC." },
  { name = "n_bins", type = "u16", doc = "Puntos de la traza." },
  { name = "channel", type = "u8", doc = "Canal de recepción al que corresponde." },
  { name = "flags", type = "u8", doc = "Reservado en v0.1; vale 0." },
  { name = "center_freq_hz", type = "f32", doc = "Frecuencia central de la traza, Hz." },
  { name = "span_hz", type = "f32", doc = "Anchura total barrida, Hz." },
  { name = "ref_level_dbm", type = "f32", doc = "Nivel de referencia, dBm." },
  { name = "pad0", type = "u32", doc = "Relleno explícito; vale 0." },
]

[[message]]
name = "status"
type_id = 3
dir = "up"
doc = """Salud y telemetría. Se emite periódicamente y ante cualquier cambio de
estado.

Deliberadamente no colapsa en un bit de vivo/muerto: lleva completitud de datos
(bins_ok frente a bins_total), deriva del periodo de disparo (medido frente a
mandado) y lectura de suelo de ruido y offset de continua por canal, que son las
tres cosas que el plan (§6.1) exige poder vigilar por separado."""

fields = [
  { name = "uptime_s", type = "u32", doc = "Segundos desde el arranque del servicio." },
  { name = "phase", type = "u8", doc = "Fase vigente: configuración o marcha. Ver la enumeración." },
  { name = "severity", type = "u8", doc = "Severidad agregada. Ver la enumeración." },
  { name = "last_error", type = "u8", doc = "Último código de error del plano de control." },
  { name = "n_rx_channels", type = "u8", doc = "Canales de recepción con lectura válida en este mensaje." },
  { name = "capability_flags", type = "u32", doc = "Modos de proceso disponibles ahora mismo." },
  { name = "bite_flags", type = "u32", doc = "Ver la tabla de banderas de BITE." },
  { name = "config_seq", type = "u32", doc = "`seq` de la configuración vigente. Permite confirmar qué se aplicó." },
  { name = "rays_in", type = "u32", doc = "Radiales recibidos del DRx." },
  { name = "rays_out", type = "u32", doc = "Radiales de momentos emitidos al RCP." },
  { name = "rays_dropped", type = "u32", doc = "Radiales descartados por contrapresión o trama mala." },
  { name = "queue_depth", type = "u32", doc = "Ocupación de la cola de ingesta, en radiales." },
  { name = "bins_ok", type = "u32", doc = "Celdas adquiridas correctamente desde el último reset." },
  { name = "bins_total", type = "u32", doc = "Celdas esperadas en el mismo intervalo." },
  { name = "trigger_period_cmd_ns", type = "u32", doc = "Periodo de disparo mandado, ns." },
  { name = "trigger_period_meas_ns", type = "u32", doc = "Periodo de disparo medido, ns. La diferencia es la deriva." },
  { name = "pad0", type = "u32", doc = "Relleno explícito; vale 0." },
  { name = "noise_floor_dbm_0", type = "f32", doc = "Suelo de ruido del canal 0, dBm." },
  { name = "noise_floor_dbm_1", type = "f32", doc = "Suelo de ruido del canal 1, dBm." },
  { name = "noise_floor_dbm_2", type = "f32", doc = "Suelo de ruido del canal 2, dBm." },
  { name = "noise_floor_dbm_3", type = "f32", doc = "Suelo de ruido del canal 3, dBm." },
  { name = "dc_offset_i_0", type = "f32", doc = "Offset de continua en I, canal 0." },
  { name = "dc_offset_i_1", type = "f32", doc = "Offset de continua en I, canal 1." },
  { name = "dc_offset_i_2", type = "f32", doc = "Offset de continua en I, canal 2." },
  { name = "dc_offset_i_3", type = "f32", doc = "Offset de continua en I, canal 3." },
  { name = "dc_offset_q_0", type = "f32", doc = "Offset de continua en Q, canal 0." },
  { name = "dc_offset_q_1", type = "f32", doc = "Offset de continua en Q, canal 1." },
  { name = "dc_offset_q_2", type = "f32", doc = "Offset de continua en Q, canal 2." },
  { name = "dc_offset_q_3", type = "f32", doc = "Offset de continua en Q, canal 3." },
]

[[message]]
name = "bite_event"
type_id = 4
dir = "up"
doc = """Un suceso de BITE con su instante. Detrás van `text_len` bytes UTF-8 de
texto libre para diagnóstico; el código es lo que se filtra y se historia, el
texto es para el operador."""

fields = [
  { name = "event_time_utc_ns", type = "u64", doc = "Instante del suceso en hora de pared, ns desde el epoch UTC. Lo lee un operador, así que nunca es monótono." },
  { name = "code", type = "u32", doc = "Código del catálogo de fallos." },
  { name = "value", type = "u32", doc = "Valor asociado; su sentido depende del código." },
  { name = "severity", type = "u8", doc = "Ver la enumeración de severidad." },
  { name = "subsystem", type = "u8", doc = "Componente del pipeline que lo emite." },
  { name = "text_len", type = "u8", doc = "Bytes UTF-8 de texto detrás de la cabecera." },
  { name = "pad0", type = "u8", doc = "Relleno explícito; vale 0." },
]

[[message]]
name = "config_ack"
type_id = 5
dir = "up"
doc = """Respuesta a un config. `error` distinto de 0 significa que NO se aplicó
nada y que la configuración anterior sigue vigente."""

fields = [
  { name = "seq", type = "u32", doc = "El `seq` del config al que responde." },
  { name = "error", type = "u8", doc = "Código de error; 0 es aceptado." },
  { name = "pad0", type = "u8", doc = "Relleno explícito; vale 0." },
  { name = "pad1", type = "u16", doc = "Relleno explícito; vale 0." },
]

[[message]]
name = "selftest_result"
type_id = 6
dir = "up"
doc = """Resultado del autotest de enlace. El plan (§6.1) lo exige en cada
reconexión del RCP: un apretón de manos TCP no basta para fiarse del enlace
para control."""

fields = [
  { name = "seq", type = "u32", doc = "El `seq` de la petición a la que responde." },
  { name = "nonce", type = "u32", doc = "El nonce de la petición, devuelto tal cual." },
  { name = "capability_flags", type = "u32", doc = "Modos de proceso disponibles." },
  { name = "error", type = "u8", doc = "Código de error; 0 es enlace apto para control." },
  { name = "version_major", type = "u8", doc = "Versión de contrato que habla el DSP." },
  { name = "version_minor", type = "u8", doc = "Versión de contrato que habla el DSP." },
  { name = "pad0", type = "u8", doc = "Relleno explícito; vale 0." },
]

[[message]]
name = "capabilities"
type_id = 7
dir = "up"
doc = """Qué sabe hacer esta compilación del DSP. Se responde a un control con
mandato `request_capabilities`, y es lo que permite al RCP no ofrecer al
operador un modo que el procesador no implementa."""

fields = [
  { name = "moment_mask", type = "u32", doc = "Momentos que este DSP puede producir, un bit por momento." },
  { name = "dealias_mask", type = "u32", doc = "Modos de dealiasing disponibles, un bit por modo." },
  { name = "estimator_mask", type = "u32", doc = "Estimadores disponibles, un bit por estimador." },
  { name = "max_gates", type = "u32", doc = "Celdas de rango máximas por radial." },
  { name = "max_pulses", type = "u16", doc = "Pulsos máximos integrables por radial." },
  { name = "n_rx_channels", type = "u8", doc = "Canales de recepción que procesa." },
  { name = "pad0", type = "u8", doc = "Relleno explícito; vale 0." },
]

[[message]]
name = "config"
type_id = 8
dir = "down"
doc = """Configuración completa. Se aplica de forma atómica: o entra entera o se
rechaza entera y el estado anterior se preserva.

Sólo se acepta en fase de configuración. En marcha se rechaza con
`not_in_setup_phase`: el plan (§6.1) exige que aplicar configuración y arrancar
la adquisición sean pasos distintos, y no que la configuración se cuele a mitad
del flujo."""

fields = [
  { name = "seq", type = "u32", doc = "Se devuelve tal cual en el config_ack." },
  { name = "moment_mask", type = "u32", doc = "Momentos a emitir, un bit por momento." },
  { name = "n_pulses", type = "u16", doc = "Pulsos a integrar por radial." },
  { name = "n_gates", type = "u16", doc = "Celdas de rango por radial." },
  { name = "clutter_filter", type = "u8", doc = "Filtro de clutter. Ver la enumeración." },
  { name = "dealias_mode", type = "u8", doc = "Modo de dealiasing de velocidad. Ver la enumeración." },
  { name = "sweep_mode", type = "u8", doc = "Modo de barrido. Ver la enumeración." },
  { name = "estimator", type = "u8", doc = "Estimador de momentos. Ver la enumeración." },
  { name = "rfi_filter", type = "u8", doc = "Filtrado de interferencia de banda estrecha: 0 no, 1 sí." },
  { name = "range_dealias", type = "u8", doc = "Recuperación de trip múltiple: 0 no, 1 sí." },
  { name = "prf_ratio_num", type = "u8", doc = "Numerador de la razón dual-PRF; 0 si no aplica." },
  { name = "prf_ratio_den", type = "u8", doc = "Denominador de la razón dual-PRF; 0 si no aplica." },
  { name = "start_range_m", type = "f32", doc = "Rango de la primera celda, metros." },
  { name = "gate_spacing_m", type = "f32", doc = "Separación entre celdas, metros. Fija el tamaño de celda." },
  { name = "prf_hz", type = "f32", doc = "PRF pedida, Hz. Se valida contra la extensión de rango." },
  { name = "sqi_threshold", type = "f32", doc = "Umbral de SQI por debajo del cual se censura la celda." },
  { name = "sig_threshold", type = "f32", doc = "Umbral de señal sobre ruido, dB." },
  { name = "ccor_threshold", type = "f32", doc = "Umbral de corrección de clutter, dB." },
  { name = "log_threshold", type = "f32", doc = "Umbral logarítmico de potencia, dB." },
  { name = "clutter_width_ms", type = "f32", doc = "Anchura espectral asumida del clutter, m/s." },
  { name = "radar_constant_db", type = "f32", doc = "Constante de radar, dB." },
  { name = "noise_floor_dbm", type = "f32", doc = "Suelo de ruido de referencia, dBm." },
  { name = "receiver_gain_db", type = "f32", doc = "Ganancia del receptor, dB." },
  { name = "zdr_offset_db", type = "f32", doc = "Corrección de sesgo de ZDR, dB." },
  { name = "phidp_offset_deg", type = "f32", doc = "Fase diferencial del sistema a restar, grados." },
  { name = "antenna_isolation_db", type = "f32", doc = "Aislamiento cruzado de la antena, dB. Satura ldr_db (lamula_polarimetry::ldr_db); sin efecto salvo LDR." },
  { name = "wavelength_m", type = "f32", doc = "Longitud de onda, metros. Escala la velocidad." },
  { name = "polarization_mode", type = "u8", doc = "Modo del segundo canal de recepción cuando n_rx_channels > 1. Ver la enumeración. Sin efecto con canal único." },
  { name = "pad0", type = "u8", doc = "Relleno explícito; vale 0." },
  { name = "burst_window_bins", type = "u16", doc = "Bins iniciales de un canal de burst (drx_dsp::channel::TX_BURST_0/1) que llevan señal real; el resto del canal es ruido/silencio. 0 si la instalación no tiene canal de burst (transmisor coherente sin monitor de burst)." },
]

[[message]]
name = "control"
type_id = 9
dir = "down"
doc = "Mandato del plano de control. Se responde siempre con un config_ack."

fields = [
  { name = "seq", type = "u32", doc = "Se devuelve tal cual en el config_ack." },
  { name = "command", type = "u8", doc = "Ver la enumeración de mandatos." },
  { name = "pad0", type = "u8", doc = "Relleno explícito; vale 0." },
  { name = "pad1", type = "u16", doc = "Relleno explícito; vale 0." },
]

[[message]]
name = "selftest_request"
type_id = 10
dir = "down"
doc = "Arranca el autotest de enlace. Obligatorio en cada reconexión del RCP."

fields = [
  { name = "seq", type = "u32", doc = "Se devuelve tal cual en el selftest_result." },
  { name = "nonce", type = "u32", doc = "Valor arbitrario que el DSP devuelve, para casar respuesta con petición." },
]

# ---------------------------------------------------------------------------
# Enumeraciones.
# ---------------------------------------------------------------------------

[[enum]]
name = "error"
type = "u8"
doc = "Códigos de rechazo del plano de control."
values = [
  { name = "ok", value = 0, doc = "Aceptado." },
  { name = "unsupported_version", value = 1, doc = "version_major desconocido." },
  { name = "unknown_message", value = 2, doc = "msg_type desconocido." },
  { name = "bad_length", value = 3, doc = "payload_len no cuadra con el mensaje." },
  { name = "not_in_setup_phase", value = 4, doc = "Llegó un config estando en marcha." },
  { name = "not_configured", value = 5, doc = "Llegó un arranque antes de la primera configuración." },
  { name = "moment_unsupported", value = 6, doc = "Se pidió un momento que esta compilación no produce." },
  { name = "dealias_unsupported", value = 7, doc = "Se pidió un modo de dealiasing no disponible." },
  { name = "estimator_unsupported", value = 8, doc = "Se pidió un estimador no disponible." },
  { name = "threshold_out_of_range", value = 9, doc = "Un umbral cae fuera de su rango admisible." },
  { name = "prf_range_illegal", value = 10, doc = "PRF y extensión de rango incompatibles; ver D-09 del DRx." },
  { name = "gate_count_illegal", value = 11, doc = "n_gates por encima de max_gates." },
  { name = "selftest_failed", value = 12, doc = "El autotest de enlace no pasó." },
  { name = "drx_link_down", value = 13, doc = "No hay enlace con el DRx; no se puede arrancar." },
]

[[enum]]
name = "moment_kind"
type = "u8"
doc = """Vocabulario canónico de momentos, común a los planes del DSP y del RCP.
Reconcilia el nombrado heredado de Vesta (dBZ/dBT) con el del RCP (UZ/CZ)."""
