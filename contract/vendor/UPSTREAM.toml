# Procedencia del contrato DRx↔DSP vendorizado.
#
# Este fichero es el pin: fija de qué commit del proyecto LAMULA DRx salieron
# los ficheros de `contract/vendor/` y con qué hash. El contrato lo posee el
# proyecto DRx (congelado en su fase Z0 por la decisión D-08); aquí sólo se
# consume. Nada de `contract/vendor/` se edita a mano: si hace falta un cambio
# de formato, se pide en el proyecto DRx, allí se sube `version_minor`, se
# regenera con `make gen`, y aquí se re-vendoriza actualizando este pin.
#
# `tools/check_vendored_contract.py` falla si un fichero de `vendor/` no
# coincide con el hash anotado, de modo que una edición local silenciosa no
# puede pasar el CI.

[upstream]
project = "lamula-drx"
repo_path = "../lamula-drx"
commit = "d1be071093b436f7d56577fd077f916b85ee6c54"
commit_date = "2026-10-05"
schema = "contract/schema/drx_dsp_v0_1.toml"
generator = "tools/gen_contract.py"

[contract]
name = "drx_dsp"
version_major = 0
version_minor = 8
magic = 0x4C4D4452
endianness = "little"

# SHA-256 de cada fichero tal y como se copió. La ruta es relativa a este
# fichero; `source` es la ruta en el repo de origen.
[[file]]
path = "drx_dsp_v0_1.rs"
source = "contract/generated/drx_dsp_v0_1.rs"
sha256 = "85836156a72ae29ca09c383a33263a2e20f00a7a1617b2d1853dc510829969fc"
role = "Implementación del lado DSP. Se compila dentro del crate de ingesta."

[[file]]
path = "drx_dsp_v0_1.py"
source = "contract/generated/drx_dsp_v0_1.py"
sha256 = "7c51fd32f334e4cea212ac3b7c65109bfad126c951edf96c5646e036706ad383"
role = "Referencia de empaquetado para el banco de pruebas y el simulador de DRx."

# El esquema TOML y la cabecera C no se vendorizan: el DSP no genera código ni
# compila C contra este contrato. Se anota su hash igualmente para detectar que
# el origen cambió sin que nadie re-vendorizara.
[[watch]]
source = "contract/schema/drx_dsp_v0_1.toml"
sha256 = "9e552740f46528d64316eef2bd915d95d2a0ac35c49a18f758799acd4f3e8105"

[[watch]]
source = "contract/generated/drx_dsp_v0_1.h"
sha256 = "d43fbdfb3df679a0596634724a6f4c8a0c197ddc82c82c9c5fa1749311e652cc"
