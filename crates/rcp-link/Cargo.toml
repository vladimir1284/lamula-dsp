[package]
name = "lamula-rcp-link"
description = "Codificación y transporte del contrato DSP↔RCP del LAMULA DSP: mensajes up (momentos, estado, BITE) y decodificación de los down (config, control, autotest)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
lamula-contract = { path = "../contract" }
# `time` lo pide la espera entre reintentos de conexión al RCP
# (`tcp::RECONNECT_DELAY`); los demás crates del workspace no lo necesitan.
tokio = { version = "1", features = ["net", "sync", "rt", "rt-multi-thread", "macros", "io-util", "time"] }

[dev-dependencies]
lamula-ingest = { path = "../ingest" }
lamula-simulator = { path = "../simulator" }
lamula-moments = { path = "../moments" }
rand = "0.8"
