[package]
name = "lamula-ingest"
description = "Acquisition Abstraction Layer, pipeline de ingesta y ensamblado de radial del LAMULA DSP."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
lamula-contract = { path = "../contract" }
rustfft = "6"
tokio = { version = "1", features = ["net", "sync", "rt", "rt-multi-thread", "macros", "io-util"] }

[dev-dependencies]
lamula-simulator = { path = "../simulator" }
lamula-moments = { path = "../moments" }
rand = "0.8"
# Los tests de transporte usan `tokio::time`; el codigo de produccion de este
# crate no. Compilaba solo porque otro crate del workspace activaba la feature
# y cargo las unifica en una compilacion completa: `cargo test -p lamula-ingest`
# a secas fallaba con E0433.
tokio = { version = "1", features = ["time"] }
