site_name: LAMULA-DSP
site_description: Reemplazo integral del stack de procesamiento y control de radar Vesta — DRx (FPGA) + DSP (Rust) + RCP (control MMI)
repo_url: https://github.com/vladimir1284/lamula-dsp
repo_name: vladimir1284/lamula-dsp

theme:
  name: material
  language: es
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: deep purple
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - Project Plans:
      - LAMULA DRx (movido al sitio del DRx): drx-plan.md
      - LAMULA DSP: dsp-plan.md
      - LAMULA RCP: rcp-plan.md
  - Contratos de cable: contracts/index.md
  - Algoritmos de procesamiento:
      - Overview: algorithms/index.md
      - Plan de estudio e implementación: algorithms/roadmap.md
      - Cadena de señal:
          - Simulador de I/Q: algorithms/simulador-iq.md
          - Burst, fase y AFC: algorithms/burst-fase-afc.md
          - Procesamiento de rango y modos: algorithms/procesamiento-de-rango.md
          - Ruido y umbrales: algorithms/ruido-y-umbrales.md
          - Filtrado de RFI: algorithms/rfi-filtrado.md
          - Mapas de clutter: algorithms/mapas-de-clutter.md
          - GMAP (filtrado de clutter): algorithms/gmap-clutter-filtering.md
      - Estimación de momentos:
          - Pulse-pair / momentos: algorithms/pulse-pair-moments.md
          - Estimador espectral: algorithms/estimador-espectral.md
          - Índices de calidad: algorithms/indices-de-calidad.md
          - Calibración de reflectividad: algorithms/reflectivity-calibration.md
      - Polarimetría:
          - Variables polarimétricas: algorithms/polarimetria-covarianzas.md
          - Estimación de KDP: algorithms/kdp-estimacion.md
          - Calibración polarimétrica: algorithms/calibracion-polarimetrica.md
      - Ambigüedades:
          - Dual-PRF dealiasing: algorithms/dual-prf-dealiasing.md
          - Staggered-PRT: algorithms/staggered-prt.md
          - Dealiasing de rango: algorithms/dealiasing-de-rango.md
          - SZ second-trip recovery: algorithms/sz-second-trip-recovery.md
      - Diagnóstico:
          - Analizador de espectro de FI: algorithms/analizador-espectro-fi.md
